name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            private/CV_en/main.tex
            private/CV_de/main.tex
            private/CL_en/main.tex
            private/CL_de/main.tex
          work_in_root_file_dir: true
          latexmk_use_xelatex: true
      - run: |
          mkdir pdf
          for d in CV_en CV_de CL_en CL_de; do cp private/$d/main.pdf pdf/Hoomaan_Nemati_$d.pdf; done
      - uses: actions/upload-artifact@v7
        with:
          name: pdf
          path: pdf/

  cicd:
    needs: latex
    uses: ckoliber/dotfiles/.github/workflows/mise.yml@main
    permissions:
      contents: write
      actions: read
    with:
      cache-tools: npm
      script: |
        mise run node:deps
        mise run node:build
        gh run download "$GITHUB_RUN_ID" -n pdf -D out/assets
        if [ "$GITHUB_EVENT_NAME" = push ]; then
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npx gh-pages@6.3.0 -d out --nojekyll --cname www.ckoliber.dev \
            -r "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git"
        fi
